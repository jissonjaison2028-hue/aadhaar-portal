  
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aadhaar-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aadhaar-portal
  template:
    metadata:
      labels:
        app: aadhaar-portal
    spec:
      containers:
        - name: aadhaar-container
          image: aadhaar-portal:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
